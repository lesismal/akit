# fit for the stampede check (bench/stampede.sh): its cache, with its lock (on by default), in
# front of the slow origin. HTTP/1.1 on 19180, h2c on 19181.
listener h1 :19180 http/1.1
listener h2c :19181 h2c
upstream origin 127.0.0.1:19103
route ready { match { path /ready }; handler respond { body ok } }
route stampede {
	match { path /stampede/* }
	middleware cache { zone stampede }
	handler proxy { upstream origin }
}
