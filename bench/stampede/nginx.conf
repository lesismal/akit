# nginx for the stampede check (bench/stampede.sh): proxy_cache with proxy_cache_lock on, as
# fitbench's cache scenarios run it, in front of the slow origin. HTTP/1.1 on 19180, h2c on 19181.
worker_processes 7;
worker_rlimit_nofile 1048576;
error_log stderr error;
events { worker_connections 65536; }
http {
    access_log off;
    proxy_cache_path /var/cache/nginx/stampede levels=1:2 keys_zone=stampede:16m max_size=1g inactive=1h use_temp_path=off;
    upstream origin {
        server 127.0.0.1:19103;
        keepalive 64;
    }
    server {
        listen 19180 reuseport backlog=4096;
        include /etc/nginx/stampede-routes.conf;
    }
    server {
        listen 19181 reuseport backlog=4096;
        http2 on;
        include /etc/nginx/stampede-routes.conf;
    }
}
