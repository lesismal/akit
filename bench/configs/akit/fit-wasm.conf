# The wasm scenario's route for the fit-wasm server (akit's bench/fitbench/akit.go, I76), given
# to fit with a second -c beside fit's own bench/configs/fit/fit.conf, which is not changed: the
# fixed response behind the wasm middleware, which runs fit's header-editing test plugin
# (headers.wasm, built from fit's plugin/wasm/testdata/headers) with its defaults, as akit's
# wasm.json does for akit.

route wasm {
	match { path /wasm }
	middleware wasm { path /etc/fit/headers.wasm; config c }
	handler respond { headers { Content-Type text/plain }; body "hello, world" }
}
