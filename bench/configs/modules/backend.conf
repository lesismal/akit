# The backend of bench/modules.sh: nginx on 127.0.0.1:19000, on the backends' CPUs, answering
# /api/* with 1 KiB of JSON (as fit's harness backend does) and anything else with "hello, world";
# /auth (forward_auth's question) 200 with no body. No server under test; the same for all.
worker_processes 2;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;
error_log stderr crit;
events {
    use epoll;
    worker_connections 65536;
    multi_accept on;
    accept_mutex off;
}
http {
    access_log off;
    server_tokens off;
    keepalive_timeout 300s;
    keepalive_requests 100000000;
    gzip off;
    server {
        listen 127.0.0.1:19000 reuseport backlog=65535;
        location /api/ {
            default_type application/json;
            return 200 '{{APIBODY}}';
        }
        location = /auth {
            return 200;
        }
        location / {
            default_type text/plain;
            return 200 "hello, world";
        }
    }
}
