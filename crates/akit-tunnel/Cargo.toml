[package]
name = "akit-tunnel"
description = "fit's tunnel on akio: a hub that nodes and proxies link to, nodes beside the services they reach, proxies that forward local ports to them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The links, the tunnels' connections, the dials and the timers.
akio = { workspace = true }
# AES-256-GCM, HKDF, PBKDF2, HMAC-SHA256 and random bytes of the links (fit's bodycrypt, proto).
akio-crypto = { workspace = true }
# The hub's self-signed certificate (I102).
akio-x509 = { workspace = true }
# QUIC links (I102b).
akio-quic = { workspace = true }
# WebSocket links (I102c): akio-http's upgrade on a hub's listener, its akio-ws client to dial.
akio-http = { workspace = true }
akit-access = { workspace = true }
akit-config = { workspace = true }
akit-observe = { workspace = true }
akit-roles = { workspace = true }
akit-runtime = { workspace = true }

[dev-dependencies]
akio-crypto = { workspace = true }
# The roles' consoles, which serve the hub's pages in the tests (I109).
akit-admin = { workspace = true }
akio-x509 = { workspace = true }

[lints]
workspace = true
