[package]
name = "akit-assistant"
description = "akit's console assistant (fit's assistant): the module ai, its settings and keys kept in the store, the model APIs it calls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# The stand-ins of the model APIs the tests talk to (`akit_assistant::standin`), for other
# crates' tests: never a real API.
stand-ins = []

[dependencies]
# The pool the store's writes run on, the engine the model calls go out on.
akio = { workspace = true }
# The SHA-256 of llm.proxy's certificate, pinned.
akio-crypto = { workspace = true }
# The requests the console module answers.
akio-http = { workspace = true }
akit-config = { workspace = true }
# akit's own log's latest messages, for log_tail (I162b).
akit-observe = { workspace = true }
# Secrets found in what the tools hand a model (fit's patterns), and data.redact's in Go's
# syntax (akit-router's compiler, as the config checked them).
akio-regex = { workspace = true }
akit-router = { workspace = true }
# The console module the assistant is served as (akit_roles::pages::Module).
akit-roles = { workspace = true }

[lints]
workspace = true
