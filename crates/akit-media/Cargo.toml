[package]
name = "akit-media"
description = "fit's media auth and streaming role on akio-media: media_auth's policies, the hub with its RTMP, RTSP and SRT listeners, and the handlers that play it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The engine the role binds its listeners on, and its timers.
akio = { workspace = true }
# SHA-256, HMAC-SHA256, bcrypt, base64url and the random keys of the policies (fit's mediaauth).
akio-crypto = { workspace = true }
# The handlers' requests, suspended while a password is checked.
akio-http = { workspace = true }
# The hub, its RTMP, RTSP and SRT servers, HTTP-FLV and HLS (I122, I123), and WHIP and WHEP on
# WebRTC (I124).
akio-media = { workspace = true, features = ["webrtc"] }
# The WebRTC port's ICE-lite server (I124).
akio-webrtc = { workspace = true }
# The interfaces' addresses a wildcard WebRTC port advertises (I124).
akio-sys = { workspace = true }
akit-access = { workspace = true }
akit-config = { workspace = true }
akit-observe = { workspace = true }
akit-roles = { workspace = true }
akit-runtime = { workspace = true }

[dev-dependencies]
# The handlers through akit's listener (tests/handlers.rs).
akit-listener = { workspace = true }

[lints]
workspace = true
