[package]
name = "akit-observe"
description = "akit's observability: access and error logs, metrics, tracing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Fuzz entry points for `fuzz/` (`akit_observe::fuzzing`); not a public API (I77).
fuzzing = []

[dependencies]
# OpenTelemetry's export (I64): the receiver's settings, and akio's HTTP client and TLS.
akio = { workspace = true }
akio-http = { workspace = true }
akit-config = { workspace = true }
# Log files (I81, decision 033): rotated files gzipped, and a file opened without waiting on a FIFO
# planted at its name (O_NONBLOCK).
akio-deflate = { workspace = true }
akio-sys = { workspace = true }

[lints]
workspace = true
