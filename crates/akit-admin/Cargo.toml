[package]
name = "akit-admin"
description = "akit's Admin API and file provider."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Fuzz entry points for `fuzz/` (`akit_admin::fuzzing`); not a public API (I77).
fuzzing = []

[dependencies]
akit-access = { workspace = true }
# The console's assistant, served as the module ai (I160).
akit-assistant = { workspace = true }
akio = { workspace = true }
akio-crypto = { workspace = true }
akio-http = { workspace = true }
akit-cache = { workspace = true }
akit-config = { workspace = true }
akit-observe = { workspace = true }
akit-provider = { workspace = true }
# The link tokens of the tunnel's hub and the LLM roles (I100): their management and views.
akit-roles = { workspace = true }
akit-tls = { workspace = true }

[dev-dependencies]
# The stand-ins of the model APIs the assistant's tests call (I161).
akit-assistant = { workspace = true, features = ["stand-ins"] }
akio-x509 = { workspace = true }
akit-handler = { workspace = true }
akit-listener = { workspace = true }
# The media libraries' endpoints, as akit run registers them (I141).
akit-media = { workspace = true }
akit-runtime = { workspace = true }

[lints]
workspace = true
