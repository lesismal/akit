[package]
name = "akit"
description = "A reverse proxy, load balancer, TLS terminator, static file server and API gateway on akio: fit rebuilt in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
publish = false
# src/main.rs is the library's command-line module, not a binary of its own.
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "akit"
path = "src/bin/akit.rs"

[dependencies]
akio = { workspace = true }
akio-sys = { workspace = true }
akit-admin = { workspace = true }
akit-provider = { workspace = true }
akit-cache = { workspace = true }
akit-plugin = { workspace = true }
akit-config = { workspace = true }
akit-observe = { workspace = true }
akit-handler = { workspace = true }
akit-middleware = { workspace = true }
akit-listener = { workspace = true }
akit-proxy = { workspace = true }
akit-runtime = { workspace = true }
akit-tls = { workspace = true }

[dev-dependencies]
akio-crypto = { workspace = true }
akio-deflate = { workspace = true }
akio-h3 = { workspace = true }
akio-http = { workspace = true }
akio-quic = { workspace = true }
akio-x509 = { workspace = true }

[lints]
workspace = true
