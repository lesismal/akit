[package]
name = "akit"
description = "A reverse proxy, load balancer, TLS terminator, static file server and API gateway on akio: fit rebuilt in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
publish = false
# src/main.rs is the library's command-line module, not a binary of its own.
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "akit"
path = "src/bin/akit.rs"

[dependencies]
akio = { workspace = true }
akio-crypto = { workspace = true }
# akit token's client of the Admin API (I100).
akio-http = { workspace = true }
akio-sys = { workspace = true }
akit-admin = { workspace = true }
# The cluster manager (I132): admin.cluster's members, served by the console.
akit-cluster = { workspace = true }
# The assistant's settings kept in the store (I160).
akit-assistant = { workspace = true }
akit-provider = { workspace = true }
akit-cache = { workspace = true }
akit-plugin = { workspace = true }
akit-config = { workspace = true }
akit-observe = { workspace = true }
akit-handler = { workspace = true }
akit-middleware = { workspace = true }
akit-listener = { workspace = true }
akit-proxy = { workspace = true }
akit-runtime = { workspace = true }
# The host of fit's roles (I100).
akit-roles = { workspace = true }
# The tunnel's roles (I101).
akit-tunnel = { workspace = true }
akit-llm = { workspace = true }
# fit's WebRTC: the TURN server, WHIP and WHEP, the media proxy (I110-I114).
akit-webrtc = { workspace = true }
# fit's BitTorrent roles and the bt_tracker handler (I151).
akit-bittorrent = { workspace = true }
# media_auth's policies and the streaming role (I121-I124), and akit media-token.
akit-media = { workspace = true }
akit-tls = { workspace = true }

[dev-dependencies]
# Torrents the BitTorrent tests make and the clients they drive (I151).
akio-bittorrent = { workspace = true }
akio-deflate = { workspace = true }
akio-h3 = { workspace = true }
akio-quic = { workspace = true }
akio-x509 = { workspace = true }

[lints]
workspace = true
