listener https_443 :443 http/1.1 h2 h3 {
	tls /etc/ssl/example.pem /etc/ssl/example.key
}

listener http_8080 :8080 http/1.1
listener http_80 :80 http/1.1

route example.com-api {
	listeners https_443
	match { host example.com www.example.com; path /api/*; method GET POST }
	middleware headers {
		response { delete Server; set { X-Frame-Options DENY } }
	}
	middleware compress { encodings gzip }
	middleware headers { response { delete X-Powered-By } }
	handler proxy {
		host_header backend.internal:8443
		upstream proxy_backend_internal_8443
	}
}

route example.com-old {
	listeners https_443
	match { host example.com www.example.com; path /old }
	middleware headers {
		response { delete Server; set { X-Frame-Options DENY } }
	}
	middleware redirect { status 301; to /new }
	middleware compress { encodings gzip }
	handler static { browse true; root /srv/www }
}

route example.com-admin {
	listeners https_443
	match { host example.com www.example.com; path /admin/* }
	middleware headers {
		response { delete Server; set { X-Frame-Options DENY } }
	}
	middleware basic_auth {
		users {
			password_hash $2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG
			username alice
		}
	}
	middleware compress { encodings gzip }
	handler static { browse true; root /srv/www }
}

route example.com {
	listeners https_443
	match { host example.com www.example.com }
	middleware headers {
		response { delete Server; set { X-Frame-Options DENY } }
	}
	middleware compress { encodings gzip }
	handler static { browse true; root /srv/www }
}

route port8080-health {
	listeners http_8080
	match { path /health }
	handler respond { body ok; status 200 }
}

route port8080 {
	listeners http_8080
	handler proxy { upstream proxy_localhost_3000 }
}

route static.example.com {
	listeners http_80
	match { host static.example.com }
	handler static {
		precompressed br gzip
		root /var/www/static
		try_files {path} /index.html
	}
}

route redirect-https {
	listeners http_80
	match { host example.com www.example.com }
	middleware redirect { status 308; to https://{host}{uri} }
	handler respond
}

upstream proxy_backend_internal_8443 backend.internal:8443 {
	connect_timeout 5s
	protocol h2
}

upstream proxy_localhost_3000 localhost:3000

access_log { output /var/log/fit/access.log }

admin { address localhost:2019 }

acme { email ops@example.com }
