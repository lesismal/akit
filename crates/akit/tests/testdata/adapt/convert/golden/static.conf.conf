listener http_8080 :8080 http/1.1

route app.test-health {
	listeners http_8080
	priority 30000
	match { host app.test **.app.test; path /health }
	middleware headers { response { add { X-Frame-Options DENY } } }
	handler respond { body ok; status 200 }
}

route app.test-_._css_js_png {
	listeners http_8080
	priority 9999
	match { host app.test **.app.test; path_regexp (?i)\.(css|js|png)$ }
	middleware headers {
		response { add { Cache-Control "public, max-age=86400" } }
	}
	handler static { root /srv/app }
}

route app.test-downloads {
	listeners http_8080
	priority 20000
	match { host app.test **.app.test; path /downloads/* }
	middleware headers { response { add { X-Frame-Options DENY } } }
	handler static { root /srv/files; strip_prefix /downloads }
}

route app.test-old {
	listeners http_8080
	match { host app.test **.app.test; path /old/* }
	middleware redirect { regexp ^/old/(.*)$; status 301; to /new/$1 }
	middleware headers { response { add { X-Frame-Options DENY } } }
	handler static { root /srv/app }
}

route app.test-docs {
	listeners http_8080
	match { host app.test **.app.test; path /docs/* }
	middleware rewrite { regexp ^/docs/(.*)$; replacement /manual/$1 }
	middleware headers { response { add { X-Frame-Options DENY } } }
	handler static { root /srv/app; try_files {path} {path}/ }
}

route app.test {
	listeners http_8080
	match { host app.test **.app.test; path /* }
	middleware headers { response { add { X-Frame-Options DENY } } }
	handler static { root /srv/app; try_files {path} {path}/ /index.html }
}
