listener http_80 :80 http/1.1

listener https_443 :443 http/1.1 {
	tls /etc/nginx/tls/shop.crt /etc/nginx/tls/shop.key
}

upstream shop_api 10.0.1.10:8080 10.0.1.11:8080 {
	load_balancing least_conn
	connect_timeout 3s
}

upstream proxy_10_0_1_20_9000 10.0.1.20:9000
upstream proxy_10_0_1_30_3000 10.0.1.30:3000

route shop.example.com {
	listeners http_80
	match { host shop.example.com }
	middleware redirect { status 301; to https://{host}{uri} }
	handler respond { status 404 }
}

route shop.example.com-api {
	listeners https_443
	match { host shop.example.com; path /api/* }
	middleware rate_limit { burst 20; key ip; rate 10 }
	middleware body_limit { max_bytes 20MiB }
	handler proxy { upstream shop_api }
}

route shop.example.com-admin {
	listeners https_443
	match { host shop.example.com; path /admin/* }
	middleware body_limit { max_bytes 20MiB }
	handler proxy { upstream proxy_10_0_1_20_9000 }
}

route shop.example.com-2 {
	listeners https_443
	match { host shop.example.com; path /* }
	middleware body_limit { max_bytes 20MiB }
	handler proxy { upstream proxy_10_0_1_30_3000 }
}
