listeners:
  - name: http_80
    address: :80
    protocols:
      - http/1.1
  - name: https_443
    address: :443
    protocols:
      - http/1.1
      - h2
    tls:
      certificates:
        - cert_file: /etc/ssl/example.com.crt
          key_file: /etc/ssl/example.com.key
upstreams:
  - name: backend
    addresses:
      - 10.0.0.1:8080
      - 10.0.0.2:8080
    weights:
      - 3
      - 1
    load_balancing: least_conn
    max_idle_conns: 64
    connect_timeout: 5s
    max_fails: 2
    fail_timeout: 30s
    response_idle_timeout: 2m
  - name: backend_backup
    addresses:
      - 10.0.0.3:8080
  - name: proxy_127_0_0_1_3000
    addresses:
      - 127.0.0.1:3000
routes:
  - name: example.com
    listeners:
      - http_80
    match:
      host:
        - example.com
        - www.example.com
    middleware:
      - module: redirect
        params:
          status: 301
          to: https://{host}{uri}
    handler:
      module: respond
      params:
        status: 404
  - name: example.com-api
    listeners:
      - https_443
    match:
      host:
        - example.com
        - www.example.com
      path:
        - /api/*
    middleware:
      - module: rate_limit
        params:
          burst: 40
          key: ip
          rate: 20
      - module: body_limit
        params:
          max_bytes: 10485760
      - module: headers
        params:
          request:
            set:
              X-Env: production
      - module: rewrite
        params:
          add_prefix: /v1
          strip_prefix:
            - /api
      - module: compress
    handler:
      module: proxy
      params:
        failover: backend_backup
        upstream: backend
  - name: example.com-2
    listeners:
      - https_443
    match:
      host:
        - example.com
        - www.example.com
      path:
        - /*
    middleware:
      - module: body_limit
        params:
          max_bytes: 10485760
      - module: compress
    handler:
      module: proxy
      params:
        upstream: proxy_127_0_0_1_3000
