listener http_8080 :8080 http/1.1
listener http_8081 :8081 http/1.1
listener https_8443 :8443 http/1.1 h2 { tls /certs/cert.pem /certs/key.pem }
listener https_8444 :8444 http/1.1 h2 { tls /certs/cert.pem /certs/key.pem }
listener https_8445 :8445 http/1.1 h2 { tls /certs/cert.pem /certs/key.pem }

route port8080-default {
	listeners http_8080 http_8081
	match { path /ws }
	middleware body_limit { max_bytes 15625KiB }
	handler respond
}

route port8080-fixed {
	listeners http_8080 http_8081
	match { path /fixed }
	middleware body_limit { max_bytes 15625KiB }
	middleware headers { response { set { Content-Type text/plain } } }
	handler respond { body "hello, world"; status 200 }
}

route port8080-static {
	listeners http_8080 http_8081
	match { path /static/* }
	middleware body_limit { max_bytes 15625KiB }
	handler static { root /srv/www }
}

route port8080-site {
	listeners http_8080 http_8081
	match { path /site/* }
	middleware body_limit { max_bytes 15625KiB }
	handler static { root /srv/www }
}

route port8080-default-2 {
	listeners http_8080 http_8081
	match { path /proxy /proxy/* /api/* }
	middleware body_limit { max_bytes 15625KiB }
	handler respond
}

route port8080 {
	listeners http_8080 http_8081
	middleware body_limit { max_bytes 15625KiB }
	handler respond { status 404 }
}

route port8443-fixed {
	listeners https_8443 https_8444 https_8445
	match { path /fixed }
	middleware body_limit { max_bytes 15625KiB }
	middleware headers { response { set { Content-Type text/plain } } }
	handler respond { body "hello, world"; status 200 }
}

route port8443-static {
	listeners https_8443 https_8444 https_8445
	match { path /static/* }
	middleware body_limit { max_bytes 15625KiB }
	handler static { root /srv/www }
}

route port8443-site {
	listeners https_8443 https_8444 https_8445
	match { path /site/* }
	middleware body_limit { max_bytes 15625KiB }
	handler static { root /srv/www }
}

route port8443-default {
	listeners https_8443 https_8444 https_8445
	match { path /proxy /proxy/* /api/* }
	middleware body_limit { max_bytes 15625KiB }
	handler respond
}

route port8443 {
	listeners https_8443 https_8444 https_8445
	middleware body_limit { max_bytes 15625KiB }
	handler respond { status 404 }
}

auto_https { disable true }
