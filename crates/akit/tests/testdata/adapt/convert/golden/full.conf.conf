listener http_80 :80 http/1.1

upstream proxy_127_0_0_1_9000 127.0.0.1:9000
upstream proxy_127_0_0_1_9001 127.0.0.1:9001

route server1 {
	listeners http_80
	match { path /* }
	handler static { root /usr/share/nginx/html }
}

route server1-__users____id__d {
	listeners http_80
	priority 9999
	match { path_regexp ^/users/(?<id>\d+)$ }
	handler proxy { upstream proxy_127_0_0_1_9000 }
}

route server1-ws {
	listeners http_80
	match { path /ws* }
	handler proxy { upstream proxy_127_0_0_1_9001 }
}

log { level warn; output /var/log/nginx/error.log }

access_log { output /var/log/nginx/access.log }
