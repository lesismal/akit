listener http_8080 :8080 http/1.1

upstream proxy_127_0_0_1_7700 127.0.0.1:7700

route docs.example.org-nginx_status {
	listeners http_8080
	priority 30000
	match { host docs.example.org; path /nginx_status }
	handler static { root /srv/docs }
}

route docs.example.org-assets {
	listeners http_8080
	match { host docs.example.org; path /assets/* }
	handler static { root /srv/docs }
}

route docs.example.org-search {
	listeners http_8080
	match { host docs.example.org; path /search* }
	handler proxy { upstream proxy_127_0_0_1_7700 }
}

route docs.example.org-private {
	listeners http_8080
	match { host docs.example.org; path /private/* }
	handler respond { status 401 }
}

route docs.example.org-counter {
	listeners http_8080
	priority 30000
	match { host docs.example.org; path /counter }
	handler static { root /srv/docs }
}

route docs.example.org {
	listeners http_8080
	match { host docs.example.org; path /* }
	handler static { root /srv/docs; try_files {path} {path}/ /index.html }
}
