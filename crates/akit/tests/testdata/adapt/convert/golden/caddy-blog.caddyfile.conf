route blog.example.net-feed.xml {
	match { host blog.example.net; path /feed.xml }
	middleware compress { encodings zstd gzip }
	handler static { root /var/www/blog }
}

route blog.example.net-api {
	match { host blog.example.net; path /api/* }
	middleware compress { encodings zstd gzip }
	middleware rewrite { strip_prefix /api }
	handler proxy { upstream proxy_10_0_2_5_4000 }
}

route blog.example.net {
	match { host blog.example.net }
	middleware compress { encodings zstd gzip }
	handler static { root /var/www/blog }
}

route www.blog.example.net-default {
	match { host www.blog.example.net }
	middleware redirect { status 301; to https://blog.example.net{uri} }
	handler respond
}

upstream proxy_10_0_2_5_4000 10.0.2.5:4000 10.0.2.6:4000 {
	load_balancing least_conn
	health_check { path /healthz; interval 10s }
}

admin {}

acme { email ops@example.net }
