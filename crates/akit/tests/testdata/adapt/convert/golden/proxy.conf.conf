listener http_80 :80 http/1.1

listener https_443 :443 http/1.1 h2 {
	tls /etc/ssl/example.com.crt /etc/ssl/example.com.key
}

upstream backend 10.0.0.1:8080 10.0.0.2:8080 {
	weights 3 1
	load_balancing least_conn
	max_idle_conns 64
	connect_timeout 5s
	max_fails 2
	fail_timeout 30s
	response_idle_timeout 2m
}

upstream backend_backup 10.0.0.3:8080
upstream proxy_127_0_0_1_3000 127.0.0.1:3000

route example.com {
	listeners http_80
	match { host example.com www.example.com }
	middleware redirect { status 301; to https://{host}{uri} }
	handler respond { status 404 }
}

route example.com-api {
	listeners https_443
	match { host example.com www.example.com; path /api/* }
	middleware rate_limit { burst 40; key ip; rate 20 }
	middleware body_limit { max_bytes 10MiB }
	middleware headers { request { set { X-Env production } } }
	middleware rewrite { add_prefix /v1; strip_prefix /api }
	middleware compress
	handler proxy { failover backend_backup; upstream backend }
}

route example.com-2 {
	listeners https_443
	match { host example.com www.example.com; path /* }
	middleware body_limit { max_bytes 10MiB }
	middleware compress
	handler proxy { upstream proxy_127_0_0_1_3000 }
}
