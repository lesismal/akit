listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
upstreams:
  - name: users
    addresses:
      - 127.0.0.1:9001
  - name: legacy
    addresses:
      - 127.0.0.1:9002
routes:
  - name: users
    match:
      path:
        - /api/users/*
    middleware:
      - module: rewrite
        params:
          strip_prefix:
            - /api
          add_prefix: /v2
    handler:
      module: proxy
      params:
        upstream: users
  - name: legacy
    match:
      path:
        - /shop/*
    middleware:
      - module: rewrite
        params:
          regexp: ^/shop/item/([0-9]+)$
          replacement: /item.php/$1
    handler:
      module: proxy
      params:
        upstream: legacy
