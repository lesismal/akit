listener https :443 http/1.1 h2 { tls { acme app.example.com; on_demand true } }
listener http :80 http/1.1

route tenants {
	listeners https
	handler respond { body "a customer's site\n" }
}

route to-https {
	listeners http
	middleware redirect { to https://{host}{uri}; status 308 }
	handler respond { status 404 }
}

acme {
	email ops@example.com
	on_demand {
		ask http://127.0.0.1:5555/allowed
		rate 10
		interval 1m
		max_names 5000
		idle_timeout 168h
	}
}
