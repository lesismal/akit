tunnel:
  node:
    name: lab
    hubs:
      - name: hub
        endpoints:
          - address: 127.0.0.1:7000
          - address: ws://127.0.0.1:7001/tunnel
        password: a-registration-password
        body_password: a-body-password
        pool_size: 4
    services:
      - name: ssh
        address: 10.0.0.5:22
        description: the lab's gateway
      - name: web
        address: 127.0.0.1:8080
    idle_timeout: 2h
    max_tunnels: 4096
