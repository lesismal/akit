listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
upstreams:
  - name: api
    addresses:
      - 127.0.0.1:9000
routes:
  - name: api
    match:
      path:
        - /api/*
    middleware:
      - module: jwt
        params:
          jwks_url: https://auth.example.com/.well-known/jwks.json
          jwks_refresh_interval: 1h
          algorithms:
            - RS256
            - ES256
          issuer: https://auth.example.com/
          audience:
            - api
          leeway: 30s
          token_from: header
          claims_headers:
            X-User: sub
            X-Scope: scope
    handler:
      module: proxy
      params:
        upstream: api
