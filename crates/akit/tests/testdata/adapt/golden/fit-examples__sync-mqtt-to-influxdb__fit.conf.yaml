sync:
  state_dir: /tmp/fit-example-sync
  pipelines:
    - name: readings
      source:
        module: mqtt
        params:
          servers:
            - mqtt.internal:8883
          tls: true
          client_id: fit-readings
          username: fit
          password_env: MQTT_PASSWORD
          topics:
            - sensors/+/+
          qos: 1
          codec:
            module: json
      sinks:
        - name: influx
          sink:
            module: influxdb
            params:
              url: https://influxdb.internal:8086
              org: iot
              bucket: readings
              token_env: INFLUX_TOKEN
              measurement: readings
              tags:
                - device
                - site
              fields:
                - temperature
                - humidity
              time_field: at
              precision: ms
          batch:
            max_records: 5000
            max_wait: 1s
    - name: alerts
      source:
        module: generate
        params:
          namespace: alerts
          records: 3
      sinks:
        - name: mqtt
          sink:
            module: mqtt
            params:
              servers:
                - mqtt.internal:8883
              tls: true
              username: fit
              password_env: MQTT_PASSWORD
              topic: alerts/{namespace}
              qos: 1
              codec:
                module: json
admin:
  address: 127.0.0.1:2019
