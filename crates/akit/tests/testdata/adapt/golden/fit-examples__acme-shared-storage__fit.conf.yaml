listeners:
  - name: https
    address: :443
    protocols:
      - http/1.1
      - h2
    tls:
      acme:
        - example.com
        - www.example.com
  - name: http
    address: :80
    protocols:
      - http/1.1
routes:
  - name: site
    listeners:
      - https
    handler:
      module: respond
      params:
        body: |
          hello from one of several
  - name: to-https
    listeners:
      - http
    middleware:
      - module: redirect
        params:
          to: https://{host}{uri}
          status: 308
    handler:
      module: respond
      params:
        status: 404
acme:
  email: ops@example.com
  shared_storage:
    redis:
      address: redis.internal:6379
      username: fit
      password_file: /etc/fit/redis-password
      db: 0
    prefix: fit/
    lock_ttl: 30s
    request_timeout: 10s
