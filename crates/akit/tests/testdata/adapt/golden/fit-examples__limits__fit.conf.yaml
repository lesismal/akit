listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
routes:
  - name: hello
    handler:
      module: respond
      params:
        body: |
          hello
limits:
  max_pending_bytes: 25%
  max_header_bytes: 65536
  max_conns: 200000
  max_body_bytes: 33554432
  max_write_queue_bytes: 8388608
  write_stall_timeout: 30s
engine:
  event_loops: 8
  workers: 64
  min_workers: 8
  task_queue: 65536
  read_buffer_size: 65536
  write_watermark: 262144
  backlog: 4096
