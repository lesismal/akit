listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
upstreams:
  - name: media-servers
    addresses:
      - 10.0.0.2:8080
      - 10.0.0.3:8080
    health_check:
      path: /healthz
routes:
  - name: webrtc
    match:
      path:
        - /whip/*
        - /whep/*
    handler:
      module: webrtc_proxy
      params:
        upstream: media-servers
        media_addrs:
          10.0.0.3:8080: 10.0.0.3:8189
        timeout: 10s
webrtc:
  proxy:
    listen: :8190
    public_ips:
      - 203.0.113.5
    max_sessions: 4096
    port_min: 40000
    port_max: 40999
