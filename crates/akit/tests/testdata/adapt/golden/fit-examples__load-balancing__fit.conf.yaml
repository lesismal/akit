listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
upstreams:
  - name: app
    addresses:
      - 10.0.0.11:8080
      - 10.0.0.12:8080
      - 10.0.0.13:8080
    weights:
      - 2
      - 2
      - 1
    load_balancing: least_conn
    sticky_cookie:
      name: fit_backend
      max_age: 1h
      secure: true
    max_conns: 512
    connect_timeout: 3s
    max_fails: 3
    fail_timeout: 30s
    health_check:
      path: /healthz
      expect_status:
        - 200
        - 204
      interval: 5s
      timeout: 2s
      fails: 2
      passes: 2
  - name: app-canary
    addresses:
      - 10.0.1.11:8080
    health_check:
      path: /healthz
  - name: app-backup
    addresses:
      - 10.0.2.11:8080
    health_check:
      type: tcp
      interval: 10s
  - name: shadow
    addresses:
      - 10.0.3.11:8080
routes:
  - name: app
    handler:
      module: proxy
      params:
        upstreams:
          - upstream: app
            weight: 95
          - upstream: app-canary
            weight: 5
        failover: app-backup
        mirror:
          upstream: shadow
          percent: 10
        retry:
          attempts: 2
          statuses:
            - 502
            - 503
            - 504
          budget_ratio: 0.2
          budget_min_per_second: 10
        timeout: 30s
