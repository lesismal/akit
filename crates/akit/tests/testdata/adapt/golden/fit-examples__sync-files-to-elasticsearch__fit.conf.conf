sync {
	state_dir /tmp/fit-example-sync
	pipelines app-logs {
		source file {
			paths /var/log/app/*.log
			codec json
			multiline { start ^\{ }
		}
		transforms filter { action drop; where { field level; equals debug } }
		sinks search {
			sink elasticsearch {
				urls https://es1:9200 https://es2:9200
				username fit
				password_env ES_PASSWORD
				index app-logs-{yyyy.MM.dd}
			}
			batch { max_records 1000; max_bytes 5MiB; max_wait 1s }
		}
		on_error dead_letter
		dead_letter { name refused; sink dead_letters }
		queue { max_records 20000; max_bytes 64MiB }
	}
}

admin { address 127.0.0.1:2019 }
