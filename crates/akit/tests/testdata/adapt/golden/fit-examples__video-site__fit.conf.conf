listener web :8080 http/1.1 h2c

media_library films { roots video-site/media }

media_auth site {
	secret_file video-site/secret
	users staff {
		password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
		play *
	}
	url_signing { ttl 2m; play_grace 30m; max_sessions 2; on_limit end_oldest }
}

streaming {
	channels tv/films { library films; items films/testcard films/bars }
}

upstream site-api 127.0.0.1:8090

route vod {
	match { path /vod/* }
	handler vod { library films; auth site; segment_duration 4s }
}

route channels {
	match { path /hls/* }
	handler hls { prefix /hls/; auth site }
}

route tokens {
	match { path /media-tokens /media-tokens/*; remote_ip 127.0.0.1/32 ::1/128 }
	middleware basic_auth {
		users {
			username site-api
			password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
		}
	}
	handler media_tokens {
		auth site
		url_prefixes /vod/films/ /hls/tv/
		max_ttl 1h
	}
}

route api { match { path /api/* }; handler proxy { upstream site-api } }

route staff {
	match { path /media /media/* }
	handler media_pages {
		auth site
		login true
		title "Video site staff"
		libraries films
		channels true
		hls /hls/{stream}/index.m3u8
	}
}

route site {
	priority -1
	handler static { root video-site/web; index index.html }
}
