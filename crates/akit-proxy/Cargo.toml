[package]
name = "akit-proxy"
description = "akit's reverse proxy for HTTP, WebSocket and gRPC, with streamed bodies and linked backpressure."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# akio's timer thread (`akio::timer::after_send`) for the tunnels' idle timeouts.
akio = { workspace = true }
akio-crypto = { workspace = true }
akio-http = { workspace = true }
akit-config = { workspace = true }
akit-observe = { workspace = true }
akit-runtime = { workspace = true }

[dev-dependencies]
# A gRPC client and server for the gRPC tests (I50).
akio-grpc = { workspace = true }
# For akit-listener's test support, which the TLS tests share (its HTTP/3 client, I10).
akio-h3 = { workspace = true }
akio-quic = { workspace = true }
akio-x509 = { workspace = true }
akit-handler = { workspace = true }
akit-listener = { workspace = true }
# Upstream TLS loaded from its files, as the graph loads it (I54).
akit-tls = { workspace = true }

[lints]
workspace = true
