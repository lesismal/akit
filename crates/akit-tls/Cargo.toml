[package]
name = "akit-tls"
description = "akit's certificate management: files, ACME, storage, OCSP stapling, on-demand TLS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Fuzz entry points for `fuzz/` (`akit_tls::fuzzing`); not a public API (I77).
fuzzing = []

[dependencies]
akio = { workspace = true }
akio-crypto = { workspace = true }
# The ACME client's requests to the CA (I31).
akio-http = { workspace = true }
akio-x509 = { workspace = true }
akit-config = { workspace = true }
# akit's own log (I82): messages through fit's loggers.
akit-observe = { workspace = true }

[lints]
workspace = true
