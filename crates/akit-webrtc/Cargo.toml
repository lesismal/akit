[package]
name = "akit-webrtc"
description = "fit's WebRTC roles on akio: a TURN server, a WHIP and WHEP media server, and the relay that puts media servers behind akit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The roles' listeners and timers on the listeners' engine, akio-tls for listen_tls.
akio = { workspace = true }
akio-http = { workspace = true }
# The TURN server (I111); the TURN credentials the media server's Link headers carry (I113).
akio-turn = { workspace = true }
# WHIP and WHEP's PeerConnections (I113).
akio-webrtc = { workspace = true }
# The interfaces' addresses a wildcard media port advertises, and the sessions' IDs.
akio-sys = { workspace = true }
akio-crypto = { workspace = true }
akit-access = { workspace = true }
akit-config = { workspace = true }
# media_auth's guard on whip's and whep's offers (I126).
akit-media = { workspace = true }
akit-observe = { workspace = true }
akit-roles = { workspace = true }
akit-runtime = { workspace = true }
# listen_tls's certificates from files, chosen per handshake.
akit-tls = { workspace = true }
# The engine slot the handlers find the media server by.
akit-upstream = { workspace = true }

[dev-dependencies]
# The media tests serve whip and whep on an akit listener.
akit-listener = { workspace = true }
# The tests' self-signed certificate.
akio-x509 = { workspace = true }

[lints]
workspace = true
