[package]
name = "akit-provider"
description = "akit's config providers: the framework, and Docker, Kubernetes, Consul and etcd."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Fuzz entry points for `fuzz/` (`akit_provider::fuzzing`); not a public API (I77).
fuzzing = []

[dependencies]
akit-config = { workspace = true }
# akit's own log (I82): messages through fit's loggers.
akit-observe = { workspace = true }
# The Kubernetes provider's regular expressions (I60), checked as routes' path_regexp is.
akit-router = { workspace = true }
# The Docker provider (I58): akio's HTTP client, over a Unix socket or TCP; the Kubernetes
# provider's client of the API server (I59): akio's HTTP/2 and HTTP/1.1 clients, its TLS, and
# base64 and SHA-256 for Secrets and the certificate files written from them; the Consul and etcd
# providers (I61): akio's HTTP client for their APIs (fit's decision 013), base64 for their values.
akio = { workspace = true }
akio-http = { workspace = true }
akio-crypto = { workspace = true }

[dev-dependencies]
# The fake API server's certificates, in tests.
akio-x509 = { workspace = true }

[lints]
workspace = true
