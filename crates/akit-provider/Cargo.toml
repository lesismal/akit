[package]
name = "akit-provider"
description = "akit's config providers: the framework, and Docker, Kubernetes, Consul and etcd."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
akit-config = { workspace = true }
# The Docker provider (I58): akio's HTTP client, over a Unix socket or TCP; the Kubernetes
# provider's client of the API server (I59): akio's HTTP/2 and HTTP/1.1 clients, its TLS, and
# base64 and SHA-256 for Secrets and the certificate files written from them.
akio = { workspace = true }
akio-http = { workspace = true }
akio-crypto = { workspace = true }

[dev-dependencies]
# The fake API server's certificates, in tests.
akio-x509 = { workspace = true }

[lints]
workspace = true
