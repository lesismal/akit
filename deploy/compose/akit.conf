# The config of compose.yaml's akit container: routes come from the containers' labels under
# "akit.", through the Docker provider; any other host gets 404.
# compose.yaml 中 akit 容器的配置：路由来自各容器 "akit." 下的标签，经由 Docker provider；
# 其他任何主机返回 404。
listener web {
	address :8080
	protocols http/1.1 h2c
}

provider {
	docker {
		label_prefix akit
	}
}

route not-found {
	priority -1
	handler respond {
		status 404
		body "no route for this host\n"
	}
}
