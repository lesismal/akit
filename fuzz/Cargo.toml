# cargo-fuzz targets (nightly): `cargo +nightly fuzz run <target>`, or `fuzz/run-all.sh` for all of
# them. A workspace of its own, so that libfuzzer-sys never reaches akit's lock file or
# cargo-deny's graph. Each target calls its crate's `fuzzing` module (feature `fuzzing`), whose
# tests replay `corpus/<target>` on stable (I77).
[package]
name = "akit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
akit-config = { path = "../crates/akit-config", features = ["fuzzing"] }
akit-router = { path = "../crates/akit-router", features = ["fuzzing"] }
akit-proxy = { path = "../crates/akit-proxy", features = ["fuzzing"] }
akit-cache = { path = "../crates/akit-cache", features = ["fuzzing"] }
akit-l4 = { path = "../crates/akit-l4", features = ["fuzzing"] }
akit-handler = { path = "../crates/akit-handler", features = ["fuzzing"] }
akit-middleware = { path = "../crates/akit-middleware", features = ["fuzzing"] }
akit-observe = { path = "../crates/akit-observe", features = ["fuzzing"] }
akit-tls = { path = "../crates/akit-tls", features = ["fuzzing"] }
akit-provider = { path = "../crates/akit-provider", features = ["fuzzing"] }
akit-admin = { path = "../crates/akit-admin", features = ["fuzzing"] }
akit-upstream = { path = "../crates/akit-upstream", features = ["fuzzing"] }
akit-plugin = { path = "../crates/akit-plugin", features = ["fuzzing"] }

[workspace]
members = ["."]

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

