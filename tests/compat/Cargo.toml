[package]
name = "akit-compat"
description = "The fit config compatibility gate: fit's templates and fit-examples, pinned, through akit's validation (decision 002, docs/compatibility.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The harness (src) depends on nothing; the gate (tests/gate.rs) runs it through akit-config.
# No feature gates it (I07b): `cargo test --workspace`, and so `make check` and CI on every OS,
# runs the gate.
[dev-dependencies]
akit-config = { workspace = true }

[lints]
workspace = true
