name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/check-docs.sh
      - run: python3 -I tools/compat-inventory.py --check
      # The config reference's tables (docs/reference/config.md, I78) are those its generator writes.
      - run: python3 -I tools/config-reference.py --check

  test:
    # Linux with akio's epoll and io_uring backends, and macOS with kqueue (rules.md rule 18).
    name: test (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: epoll
          - os: ubuntu-latest
            backend: uring
          - os: macos-latest
            backend: kqueue
    env:
      AKIO_TEST_BACKEND: ${{ matrix.backend == 'uring' && 'uring' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.85, akio's)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml would otherwise pick stable.
      - run: cargo +1.85 check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    # Each reader fuzzed for a minute (dev-plan I02: "fuzzed for a minute in CI").
    name: fuzz (${{ matrix.target }}, 60s)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [config_json, config_conf, config_yaml, config_value]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

  packaging:
    # What a release ships (deploy/README.md), built and run as it says: the static Linux binary
    # from scripts/dist.sh, the systemd units on the runner's systemd, the container image serving
    # its placeholder config and the Docker Compose example (deploy/compose) on it, and the Helm
    # chart's config read by akit.
    name: packaging (binary, systemd, image, Compose, chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
      - name: Static binary
        run: |
          TARGETS=linux/amd64 scripts/dist.sh
          scripts/check-dist.sh
      - name: systemd units
        run: |
          tar -C "$RUNNER_TEMP" -xzf dist/akit_*_linux_amd64.tar.gz
          sudo deploy/systemd/test.sh "$RUNNER_TEMP"/akit_*_linux_amd64/akit
      - name: Container image
        run: |
          docker build --build-arg VERSION=ci -t akit:ci .
          docker run --rm akit:ci version | grep -qx 'akit ci'
          docker run -d --name akit -p 8080:8080 akit:ci
          trap 'docker logs akit; docker rm -f akit' EXIT
          for _ in $(seq 20); do
            curl -sf -m 2 http://127.0.0.1:8080/ | grep -q 'akit is running' && exit 0
            sleep 0.5
          done
          echo "the image's placeholder config never answered" >&2
          exit 1
      - name: Docker Compose example
        # M4's exit criterion: the Docker provider routes the app's containers by their labels
        # and follows them as they are scaled, stopped and started (deploy/compose/README.md).
        run: AKIT_IMAGE=akit:ci deploy/compose/test.sh
      - name: Helm chart
        run: |
          akit=$(echo "$RUNNER_TEMP"/akit_*_linux_amd64/akit)
          helm lint deploy/helm/akit
          for set in "" "--set ingress.enabled=false" "--set provider.namespaces={default}"; do
            # shellcheck disable=SC2086
            helm template t deploy/helm/akit --api-versions gateway.networking.k8s.io/v1/GatewayClass $set \
              > "$RUNNER_TEMP/chart.yaml"
            sed -n '/^  akit.json: |$/,/^---/p' "$RUNNER_TEMP/chart.yaml" | sed '1d;/^---/d;s/^    //' \
              > "$RUNNER_TEMP/akit.json"
            cat "$RUNNER_TEMP/akit.json"
            "$akit" validate -c "$RUNNER_TEMP/akit.json"
            grep -q 'kind: GatewayClass' "$RUNNER_TEMP/chart.yaml"
          done

  conformance:
    # The Gateway API's conformance suite, the GATEWAY-HTTP profile akit claims (M4's exit
    # criterion), as fit's CI job of the same name runs it: fit's suite module, akit outside a
    # kind cluster with the Kubernetes provider, Gateways on 127.0.0.1's ports 80 and 443
    # (tests/conformance/README.md).
    name: Gateway API conformance (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # fit's commit akit reads as its specification (docs/progress.md); its test/conformance
          # module requires sigs.k8s.io/gateway-api v1.3.0.
          repository: lesismal/fit
          ref: 7daee573b102d87837cc10f033e4cc5894769210
          path: .fit
          sparse-checkout: test/conformance
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: .fit/test/conformance/go.mod
          cache-dependency-path: .fit/test/conformance/go.sum
      - name: Create a kind cluster
        run: |
          if ! command -v kind >/dev/null; then
            go install sigs.k8s.io/kind@v0.30.0
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
            export PATH="$(go env GOPATH)/bin:$PATH"
          fi
          kind create cluster --name akit --wait 120s --kubeconfig "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Install the Gateway API's CRDs
        run: kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/experimental-install.yaml
      - name: Route the pod network through the node
        run: |
          node=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' akit-control-plane)
          cidr=$(kubectl get node akit-control-plane -o jsonpath='{.spec.podCIDR}')
          sudo ip route add "$cidr" via "$node"
      - name: Build akit and the suite
        run: |
          cargo build --release -p akit
          cp target/release/akit "$RUNNER_TEMP/akit"
          sudo setcap cap_net_bind_service=+ep "$RUNNER_TEMP/akit"
          cd .fit/test/conformance && go test -c -o "$RUNNER_TEMP/conformance.test" .
      - name: Run the suite
        run: REPORT="$RUNNER_TEMP/report.yaml" AKIT_LOG="$RUNNER_TEMP/akit.log" tests/conformance/run.sh "$RUNNER_TEMP/akit" "$RUNNER_TEMP/conformance.test"
      - name: Keep the report and akit's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: |
            ${{ runner.temp }}/report.yaml
            ${{ runner.temp }}/akit.log
