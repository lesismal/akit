name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/check-docs.sh
      - run: python3 -I tools/compat-inventory.py --check

  test:
    # Linux with akio's epoll and io_uring backends, and macOS with kqueue (rules.md rule 18).
    name: test (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: epoll
          - os: ubuntu-latest
            backend: uring
          - os: macos-latest
            backend: kqueue
    env:
      AKIO_TEST_BACKEND: ${{ matrix.backend == 'uring' && 'uring' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.85, akio's)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml would otherwise pick stable.
      - run: cargo +1.85 check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    # Each reader fuzzed for a minute (dev-plan I02: "fuzzed for a minute in CI").
    name: fuzz (${{ matrix.target }}, 60s)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [config_json, config_conf, config_yaml, config_value]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

  packaging:
    # What a release ships (deploy/README.md), built and run as it says: the static Linux binary
    # from scripts/dist.sh, the systemd units on the runner's systemd, the container image serving
    # its placeholder config, and the Helm chart's config read by akit.
    name: packaging (binary, systemd, image, chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
      - name: Static binary
        run: |
          TARGETS=linux/amd64 scripts/dist.sh
          scripts/check-dist.sh
      - name: systemd units
        run: |
          tar -C "$RUNNER_TEMP" -xzf dist/akit_*_linux_amd64.tar.gz
          sudo deploy/systemd/test.sh "$RUNNER_TEMP"/akit_*_linux_amd64/akit
      - name: Container image
        run: |
          docker build --build-arg VERSION=ci -t akit:ci .
          docker run --rm akit:ci version | grep -qx 'akit ci'
          docker run -d --name akit -p 8080:8080 akit:ci
          trap 'docker logs akit; docker rm -f akit' EXIT
          for _ in $(seq 20); do
            curl -sf -m 2 http://127.0.0.1:8080/ | grep -q 'akit is running' && exit 0
            sleep 0.5
          done
          echo "the image's placeholder config never answered" >&2
          exit 1
      - name: Helm chart
        run: |
          akit=$(echo "$RUNNER_TEMP"/akit_*_linux_amd64/akit)
          helm lint deploy/helm/akit
          for set in "" "--set ingress.enabled=false" "--set provider.namespaces={default}"; do
            # shellcheck disable=SC2086
            helm template t deploy/helm/akit --api-versions gateway.networking.k8s.io/v1/GatewayClass $set \
              > "$RUNNER_TEMP/chart.yaml"
            sed -n '/^  akit.json: |$/,/^---/p' "$RUNNER_TEMP/chart.yaml" | sed '1d;/^---/d;s/^    //' \
              > "$RUNNER_TEMP/akit.json"
            cat "$RUNNER_TEMP/akit.json"
            "$akit" validate -c "$RUNNER_TEMP/akit.json"
            grep -q 'kind: GatewayClass' "$RUNNER_TEMP/chart.yaml"
          done
