# cargo-deny (rules.md rule 17; decision 001: akio and std only on the data plane).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# No advisory is ignored. An exception goes here and into .cargo/audit.toml together, each with its
# reason and the crate's path to akit (decision 030); CI runs both tools daily
# (.github/workflows/security.yml).
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Widened only with a decision note for the dependency that needs it.
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 0.8
# Every locked crate today is MIT, or offers MIT beside Apache-2.0 and is counted as MIT, so the
# Apache-2.0 allowance matches nothing; it stays allowed (decision 001) without a warning on each
# run (I80, decision 030).
unused-allowed-license = "allow"

[licenses.private]
# akit's own crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No async runtime in akit (rules.md rule 16, decision 001).
deny = [
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/lesismal/akio"]
